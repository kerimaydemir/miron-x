name: Manual Live Tweet Cleanup

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Type DELETE to remove reviewed candidates. Any other value is dry run.'
        required: true
        default: 'DRY_RUN'
      expected_delete_count:
        description: 'Exact candidate count shown by the live audit'
        required: false
        default: ''

jobs:
  audit-and-cleanup:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm' }
      - run: npm ci --ignore-scripts --no-audit --fund=false
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true
      - run: node src/sync-timeline.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          TIMELINE_LIMIT: '800'
      - run: node src/audit-tweets.js
        env:
          TWEET_AUDIT_SOURCE: live
      - run: node src/cleanup-tweets.js
        if: ${{ inputs.apply != 'DELETE' }}
      - run: node src/cleanup-tweets.js --apply
        if: ${{ inputs.apply == 'DELETE' }}
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          EXPECTED_DELETE_COUNT: ${{ inputs.expected_delete_count }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_timeline.json data/tweet_audit_candidates.json data/tweet_deletion_results.json
          git diff --staged --quiet || git commit -m "chore: audit X timeline cleanup [skip ci]"
          git push
